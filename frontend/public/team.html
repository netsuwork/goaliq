<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Matches — GoalIQ</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c10;
    --surface: #12151c;
    --card: #181c26;
    --border: #1e2330;
    --accent: #38bdf8;
    --text: #e8eaf0;
    --muted: #6b7280;
    --win: #22c55e;
    --draw: #f59e0b;
    --loss: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; color: var(--accent); letter-spacing: 2px; text-decoration: none; }
  .back-btn {
    margin-left: auto;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }

  .club-hero {
    background: linear-gradient(160deg, #0f172a, #1e293b);
    border-bottom: 1px solid var(--border);
    padding: 36px 24px;
  }
  .club-hero-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 24px;
  }
  .hero-crest {
    width: 80px;
    height: 80px;
    object-fit: contain;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
  }
  .hero-info h1 { font-family: 'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 2px; }
  .hero-info p { color: var(--muted); font-size: 14px; margin-top: 4px; }

  .stats-row {
    display: flex;
    gap: 20px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .stat-pill strong { color: var(--text); }
  .stat-pill span { color: var(--muted); }

  .container { max-width: 900px; margin: 0 auto; padding: 32px 24px; }

  .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 18px;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

  .matches-list { display: flex; flex-direction: column; gap: 8px; }

  .match-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    display: grid;
    grid-template-columns: 90px 1fr auto 1fr 80px;
    align-items: center;
    gap: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-decoration: none;
  }
  .match-row:hover { border-color: var(--accent); background: #1c2030; }

  .match-date { font-size: 12px; color: var(--muted); line-height: 1.4; }
  .match-date strong { display: block; color: var(--text); font-size: 13px; }

  .team-name { font-size: 14px; font-weight: 500; }
  .team-name.home { text-align: right; }
  .team-name.away { text-align: left; }
  .team-name.highlight { color: var(--accent); }

  .score-box {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 80px;
  }
  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--text);
    line-height: 1;
  }
  .score-divider { color: var(--muted); font-size: 18px; }

  .result-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 14px;
    padding: 4px 10px;
    border-radius: 6px;
    text-align: center;
    letter-spacing: 1px;
  }
  .result-W { background: rgba(34,197,94,0.15); color: var(--win); border: 1px solid rgba(34,197,94,0.3); }
  .result-D { background: rgba(245,158,11,0.15); color: var(--draw); border: 1px solid rgba(245,158,11,0.3); }
  .result-L { background: rgba(239,68,68,0.12); color: var(--loss); border: 1px solid rgba(239,68,68,0.25); }
  .result-U { background: var(--border); color: var(--muted); }

  .goal-pills { font-size: 11px; color: var(--muted); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }
  .goal-pills .scorer { color: #94a3b8; }

  .loading { text-align: center; padding: 60px; color: var(--muted); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .competition-header {
    background: rgba(56,189,248,0.06);
    border: 1px solid rgba(56,189,248,0.15);
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .no-matches { text-align: center; padding: 40px; color: var(--muted); font-size: 15px; }

  footer { border-top: 1px solid var(--border); padding: 20px; text-align: center; color: var(--muted); font-size: 12px; margin-top: 48px; }

  @media (max-width: 600px) {
    .match-row { grid-template-columns: 70px 1fr auto 1fr 60px; gap: 6px; padding: 12px; }
    .team-name { font-size: 12px; }
    .score-num { font-size: 22px; }
    .match-date { font-size: 11px; }
    .goal-pills { display: none; }
    .hero-crest { width: 56px; height: 56px; }
    .hero-info h1 { font-size: 30px; }
  }
</style>
</head>
<body>

<header>
  <a href="/" class="logo">GoalIQ</a>
  <span id="headerClub" style="color:var(--muted);font-size:13px;"></span>
  <a href="teams.html" class="back-btn">← All Clubs</a>
</header>

<div class="club-hero">
  <div class="club-hero-inner">
    <img id="clubCrest" class="hero-crest" src="" alt="" onerror="this.style.display='none'">
    <div class="hero-info">
      <h1 id="clubName">Loading...</h1>
      <p>Premier League 2024/25 · All Matches</p>
      <div class="stats-row" id="statsRow"></div>
    </div>
  </div>
</div>

<div class="container">
  <div class="section-label">All Matches This Season</div>
  <div class="matches-list" id="matchesList">
    <div class="loading"><div class="spinner"></div>Fetching matches...</div>
  </div>
</div>

<footer>GoalIQ · Data via football-data.org · 2024/25 Premier League</footer>

<script>
const API_BASE = window.location.hostname === 'localhost' ? 'http://localhost:5000/api' : '/api';
const params = new URLSearchParams(window.location.search);
const TEAM_ID = parseInt(params.get('id'));
const TEAM_NAME = decodeURIComponent(params.get('name') || 'Club');

document.getElementById('clubName').textContent = TEAM_NAME;
document.getElementById('headerClub').textContent = TEAM_NAME;
document.getElementById('clubCrest').src = `https://crests.football-data.org/${TEAM_ID}.png`;
document.title = `${TEAM_NAME} — GoalIQ`;

function formatDate(dateStr) {
  if (!dateStr) return '—';
  const d = new Date(dateStr);
  return {
    day: d.toLocaleDateString('en-GB', { weekday: 'short' }),
    date: d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }),
    year: d.getFullYear()
  };
}

function getResult(match, teamId) {
  const score = match.score?.fullTime;
  if (!score || score.home === null) return 'U';
  const isHome = match.homeTeam?.id === teamId;
  const mine = isHome ? score.home : score.away;
  const theirs = isHome ? score.away : score.home;
  if (mine > theirs) return 'W';
  if (mine === theirs) return 'D';
  return 'L';
}

function buildGoalScorers(match, teamId) {
  const goals = match.goals || [];
  if (!goals.length) return '';
  return goals
    .filter(g => g.team?.id === teamId && g.type !== 'OWN_GOAL')
    .map(g => {
      const assist = g.assist?.name ? ` (${g.assist.name.split(' ').pop()})` : '';
      return `${g.scorer?.name?.split(' ').pop() || '?'} ${g.minute}'${assist}`;
    })
    .join(' · ') || '';
}

function renderMatches(matches) {
  const list = document.getElementById('matchesList');
  if (!matches || !matches.length) {
    list.innerHTML = '<div class="no-matches">No matches found for this season.</div>';
    return;
  }

  // Sort by date descending (most recent first)
  matches.sort((a, b) => new Date(b.utcDate) - new Date(a.utcDate));

  // Calculate season stats
  let W = 0, D = 0, L = 0, GF = 0, GA = 0;
  matches.forEach(m => {
    const score = m.score?.fullTime;
    if (!score || score.home === null) return;
    const isHome = m.homeTeam?.id === TEAM_ID;
    const mine = isHome ? score.home : score.away;
    const theirs = isHome ? score.away : score.home;
    GF += mine; GA += theirs;
    const res = getResult(m, TEAM_ID);
    if (res === 'W') W++;
    else if (res === 'D') D++;
    else if (res === 'L') L++;
  });

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill"><strong style="color:var(--win)">${W}</strong><span>Wins</span></div>
    <div class="stat-pill"><strong style="color:var(--draw)">${D}</strong><span>Draws</span></div>
    <div class="stat-pill"><strong style="color:var(--loss)">${L}</strong><span>Losses</span></div>
    <div class="stat-pill"><strong>${GF}</strong><span>Goals For</span></div>
    <div class="stat-pill"><strong>${GA}</strong><span>Goals Against</span></div>
  `;

  list.innerHTML = matches.map(match => {
    const score = match.score?.fullTime;
    const hasScore = score && score.home !== null;
    const isHome = match.homeTeam?.id === TEAM_ID;
    const result = getResult(match, TEAM_ID);
    const dateObj = formatDate(match.utcDate);
    const goalStr = buildGoalScorers(match, TEAM_ID);

    const homeScore = hasScore ? score.home : '—';
    const awayScore = hasScore ? score.away : '—';

    return `
      <a class="match-row" href="match-detail.html?id=${match.id}&teamId=${TEAM_ID}">
        <div class="match-date">
          <strong>${dateObj.day} ${dateObj.date}</strong>
          ${match.competition?.name || 'Premier League'}
        </div>
        <div>
          <div class="team-name home ${isHome ? 'highlight' : ''}">${match.homeTeam?.shortName || match.homeTeam?.name || '?'}</div>
          ${goalStr && isHome ? `<div class="goal-pills scorer">${goalStr}</div>` : ''}
        </div>
        <div class="score-box">
          <span class="score-num">${homeScore}</span>
          <span class="score-divider">–</span>
          <span class="score-num">${awayScore}</span>
        </div>
        <div>
          <div class="team-name away ${!isHome ? 'highlight' : ''}">${match.awayTeam?.shortName || match.awayTeam?.name || '?'}</div>
          ${goalStr && !isHome ? `<div class="goal-pills scorer">${goalStr}</div>` : ''}
        </div>
        <div class="result-badge result-${result}">${result === 'U' ? 'TBD' : result}</div>
      </a>
    `;
  }).join('');
}

async function loadMatches() {
  try {
    const res = await fetch(`${API_BASE}/teams/${TEAM_ID}/season-matches`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderMatches(data.matches || []);
  } catch (err) {
    document.getElementById('matchesList').innerHTML = `
      <div style="text-align:center;padding:40px;color:var(--muted)">
        <div style="font-size:32px;margin-bottom:12px">⚠️</div>
        <div>Could not load matches. Check your internet or API key.</div>
        <div style="font-size:12px;margin-top:8px;color:#4b5563">${err.message}</div>
      </div>`;
  }
}

loadMatches();
</script>
</body>
</html>
