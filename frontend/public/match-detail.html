<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Detail · GoalIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5a0;
      --accent2: #7c6fff;
      --text: #f0f0f8;
      --muted: #6b6b88;
      --home: #3b8bff;
      --away: #ff6b6b;
      --win: #00e5a0;
      --draw: #f0c040;
      --loss: #ff5a5a;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
    }

    /* NAV */
    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-back {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      cursor: pointer;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      transition: all 0.2s;
    }
    .nav-back:hover { color: var(--text); border-color: var(--accent); }
    .nav-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.3rem;
      letter-spacing: 0.06em;
      color: var(--accent);
    }

    /* HERO SCOREBOARD */
    .hero {
      background: linear-gradient(135deg, #0d0d18 0%, #131325 50%, #0d0d18 100%);
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem 2rem;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 50%, rgba(0,229,160,0.05) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 50%, rgba(124,111,255,0.05) 0%, transparent 60%);
    }
    .hero-inner { position: relative; max-width: 700px; margin: 0 auto; }

    .competition-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.3rem 0.8rem;
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.05em;
      margin-bottom: 1.8rem;
    }
    .competition-badge img {
      width: 16px; height: 16px; object-fit: contain;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 1rem;
    }
    .team-side {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.7rem;
    }
    .team-side.away { }
    .team-logo {
      width: 64px; height: 64px; object-fit: contain;
    }
    .team-logo-fallback {
      width: 64px; height: 64px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.6rem;
      color: var(--muted);
    }
    .team-name {
      font-size: 0.9rem;
      font-weight: 600;
      text-align: center;
      line-height: 1.2;
    }
    .team-formation {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }

    .score-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
    }
    .score-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 4.5rem;
      line-height: 1;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.2rem;
    }
    .score-home { color: var(--home); }
    .score-sep { color: var(--muted); font-size: 3rem; }
    .score-away { color: var(--away); }
    .ht-score {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      background: rgba(255,255,255,0.04);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
    }
    .match-status {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
    }
    .status-finished { background: rgba(0,229,160,0.1); color: var(--win); }
    .status-live { background: rgba(255,90,90,0.15); color: var(--loss); animation: pulse 1.5s infinite; }
    .status-scheduled { background: rgba(240,192,64,0.1); color: var(--draw); }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    .match-meta {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* MAIN CONTENT */
    .content {
      max-width: 700px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    /* SECTION CARD */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .card-header {
      padding: 1rem 1.2rem 0.8rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .card-header-icon { font-size: 1rem; }
    .card-header-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--text);
    }
    .card-body { padding: 1rem 1.2rem; }

    /* GOALS */
    .goals-list { display: flex; flex-direction: column; gap: 0.6rem; }
    .goal-item {
      display: grid;
      grid-template-columns: 40px 1fr auto 1fr 40px;
      align-items: center;
      gap: 0.5rem;
    }
    .goal-minute {
      font-family: 'DM Mono', monospace;
      font-size: 0.78rem;
      color: var(--accent);
      text-align: center;
      background: rgba(0,229,160,0.07);
      border-radius: 4px;
      padding: 0.2rem 0.3rem;
    }
    .goal-scorer-home {
      text-align: right;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .goal-scorer-away {
      text-align: left;
      font-size: 0.88rem;
      font-weight: 500;
    }
    .goal-icon { text-align: center; font-size: 1rem; }
    .goal-assist {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .goal-type-tag {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      margin-left: 0.3rem;
    }
    .tag-pen { background: rgba(124,111,255,0.15); color: var(--accent2); }
    .tag-og { background: rgba(255,90,90,0.15); color: var(--loss); }
    .goal-empty { color: var(--muted); font-size: 0.8rem; text-align: center; padding: 1rem; }

    /* LINEUPS */
    .lineups-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
    }
    .lineup-team { }
    .lineup-team-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.8rem;
      padding-bottom: 0.6rem;
      border-bottom: 1px solid var(--border);
    }
    .lineup-team-logo { width: 22px; height: 22px; object-fit: contain; }
    .lineup-team-name { font-size: 0.82rem; font-weight: 600; }
    .lineup-formation-badge {
      margin-left: auto;
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--accent);
      background: rgba(0,229,160,0.07);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }
    .lineup-section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.7rem 0 0.4rem;
    }
    .player-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.4rem;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .player-row:hover { background: var(--surface2); }
    .player-number {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--muted);
      width: 20px;
      text-align: center;
      flex-shrink: 0;
    }
    .player-name { font-size: 0.82rem; }
    .player-captain {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--draw);
      background: rgba(240,192,64,0.12);
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      margin-left: auto;
    }
    .player-sub { color: var(--muted); font-size: 0.78rem; }
    .bench-list { display: flex; flex-direction: column; }

    /* CARDS / BOOKINGS */
    .bookings-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .booking-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
    }
    .card-icon {
      width: 12px; height: 16px;
      border-radius: 2px;
      flex-shrink: 0;
    }
    .card-yellow { background: #f0c040; }
    .card-red { background: #ff4040; }
    .booking-player { font-weight: 500; }
    .booking-team { color: var(--muted); font-size: 0.78rem; }
    .booking-minute {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* SUBS */
    .subs-list { display: flex; flex-direction: column; gap: 0.5rem; }
    .sub-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
    }
    .sub-icon { font-size: 0.9rem; }
    .sub-out { color: var(--loss); }
    .sub-in { color: var(--win); }
    .sub-minute {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--muted);
      margin-left: auto;
    }
    .sub-team { color: var(--muted); font-size: 0.78rem; }

    /* LOADING / ERROR */
    .loading-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 5rem 2rem;
      gap: 1rem;
      color: var(--muted);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.9rem; }

    .error-box {
      background: rgba(255,90,90,0.08);
      border: 1px solid rgba(255,90,90,0.2);
      border-radius: 10px;
      padding: 1.5rem;
      text-align: center;
      color: var(--loss);
      font-size: 0.9rem;
      margin: 2rem 1.5rem;
    }

    .empty-section {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.8rem 0;
      text-align: center;
    }

    @media (max-width: 500px) {
      .scoreboard { gap: 0.5rem; }
      .score-display { font-size: 3.2rem; }
      .team-logo { width: 48px; height: 48px; }
      .lineups-grid { grid-template-columns: 1fr; }
      .goal-item { grid-template-columns: 36px 1fr auto 1fr 36px; }
    }
  </style>
</head>
<body>

<nav>
  <button class="nav-back" onclick="history.back()">← Back</button>
  <span class="nav-title">GoalIQ</span>
</nav>

<div id="root">
  <div class="loading-screen">
    <div class="spinner"></div>
    <div class="loading-text">Loading match details…</div>
  </div>
</div>

<script>
  // ─── CONFIG ────────────────────────────────────────────────────────────────
  const API_BASE = window.location.hostname === 'localhost'
    ? 'http://localhost:5000/api'
    : 'https://goaliq.onrender.com/api';

  const FOOTBALL_BASE = 'https://api.football-data.org/v4';

  // ─── HELPERS ───────────────────────────────────────────────────────────────
  function qs(sel, parent = document) { return parent.querySelector(sel); }

  function getParam(key) {
    return new URLSearchParams(window.location.search).get(key);
  }

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str);
    return d.toLocaleDateString('en-GB', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    }) + ' · ' + d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  }

  function teamInitial(name) {
    return (name || '?').charAt(0).toUpperCase();
  }

  function logoImg(url, name, cls = 'team-logo') {
    if (!url) return `<div class="team-logo-fallback">${teamInitial(name)}</div>`;
    return `<img src="${url}" class="${cls}" alt="${name}" onerror="this.outerHTML='<div class=\\'team-logo-fallback\\'>${teamInitial(name)}</div>'">`;
  }

  function statusBadge(status) {
    if (!status) return '';
    const map = {
      FINISHED: ['status-finished', 'FT'],
      IN_PLAY:  ['status-live', '● LIVE'],
      PAUSED:   ['status-live', 'HT'],
      TIMED:    ['status-scheduled', 'UPCOMING'],
      SCHEDULED:['status-scheduled', 'UPCOMING'],
    };
    const [cls, label] = map[status] || ['status-scheduled', status];
    return `<span class="match-status ${cls}">${label}</span>`;
  }

  // ─── FETCH MATCH FROM FOOTBALL-DATA.ORG VIA BACKEND PROXY ─────────────────
  // We call our backend which proxies to football-data.org so the API key stays safe.
  // Backend route: GET /api/matches/:matchId/detail
  // Falls back to direct call if backend doesn't have the proxy yet.

  async function fetchMatchDetail(matchId) {
    // Try backend proxy first
    try {
      const res = await fetch(`${API_BASE}/matches/${matchId}/detail`);
      if (res.ok) {
        const json = await res.json();
        return json.match || json;
      }
    } catch (e) { /* fallthrough */ }

    // If backend proxy not yet set up, we can't call football-data.org directly
    // from the browser (CORS). Show helpful message.
    throw new Error('Match detail endpoint not found. Add GET /api/matches/:id/detail to your backend.');
  }

  // ─── RENDER ────────────────────────────────────────────────────────────────

  function renderHero(match) {
    const home = match.homeTeam;
    const away = match.awayTeam;
    const score = match.score;
    const hGoals = score?.fullTime?.home ?? '–';
    const aGoals = score?.fullTime?.away ?? '–';
    const htH = score?.halfTime?.home;
    const htA = score?.halfTime?.away;
    const htStr = (htH != null && htA != null) ? `HT ${htH}–${htA}` : '';

    const homeFormation = match.homeTeamLineup?.formation || match.homeLineup?.formation || null;
    const awayFormation = match.awayTeamLineup?.formation || match.awayLineup?.formation || null;

    return `
      <div class="hero">
        <div class="hero-inner">
          <div class="competition-badge">
            ${match.competition?.emblem
              ? `<img src="${match.competition.emblem}" alt="">` : ''}
            ${match.competition?.name || 'Premier League'} · Matchday ${match.matchday || ''}
          </div>

          <div class="scoreboard">
            <div class="team-side">
              ${logoImg(home?.crest, home?.name)}
              <div class="team-name">${home?.name || '–'}</div>
              ${homeFormation ? `<div class="team-formation">${homeFormation}</div>` : ''}
            </div>

            <div class="score-center">
              ${statusBadge(match.status)}
              <div class="score-display">
                <span class="score-home">${hGoals}</span>
                <span class="score-sep">:</span>
                <span class="score-away">${aGoals}</span>
              </div>
              ${htStr ? `<div class="ht-score">${htStr}</div>` : ''}
            </div>

            <div class="team-side">
              ${logoImg(away?.crest, away?.name)}
              <div class="team-name">${away?.name || '–'}</div>
              ${awayFormation ? `<div class="team-formation">${awayFormation}</div>` : ''}
            </div>
          </div>

          <div class="match-meta">
            ${formatDate(match.utcDate)}
            ${match.venue ? ` · ${match.venue}` : ''}
          </div>
        </div>
      </div>`;
  }

  function renderGoals(match) {
    const goals = match.goals || [];
    const homeId = match.homeTeam?.id;

    if (!goals.length) {
      return `<div class="goal-empty">No goals recorded</div>`;
    }

    const rows = goals.map(g => {
      const isHome = g.team?.id === homeId;
      const scorer = g.scorer?.name || '?';
      const assist = g.assist?.name;
      const minute = g.minute + (g.injuryTime ? `+${g.injuryTime}` : '') + `'`;
      const isPen = g.type === 'PENALTY';
      const isOG  = g.type === 'OWN_GOAL';
      const typeTag = isPen ? `<span class="goal-type-tag tag-pen">PEN</span>`
                   : isOG  ? `<span class="goal-type-tag tag-og">OG</span>` : '';
      const ball = isOG ? '⚽🔴' : '⚽';

      const homeCell = isHome ? `
        <div>
          <div>${scorer}${typeTag}</div>
          ${assist ? `<div class="goal-assist">🅰 ${assist}</div>` : ''}
        </div>` : `<div></div>`;

      const awayCell = !isHome ? `
        <div>
          <div>${scorer}${typeTag}</div>
          ${assist ? `<div class="goal-assist">🅰 ${assist}</div>` : ''}
        </div>` : `<div></div>`;

      return `
        <div class="goal-item">
          <div class="goal-minute">${minute}</div>
          <div class="goal-scorer-home">${homeCell}</div>
          <div class="goal-icon">${ball}</div>
          <div class="goal-scorer-away">${awayCell}</div>
          <div></div>
        </div>`;
    });

    return `<div class="goals-list">${rows.join('')}</div>`;
  }

  function renderLineupSide(lineup, team, side) {
    if (!lineup || !lineup.startXI?.length) {
      return `<div class="empty-section">Lineup not available</div>`;
    }

    const starters = lineup.startXI.map(p => p.player || p);
    const bench    = (lineup.bench || []).map(p => p.player || p);
    const formation = lineup.formation || '';
    const captain = starters.find(p => p.captain);

    const playerRow = (p, isSub = false) => `
      <div class="player-row">
        <span class="player-number">${p.shirtNumber || ''}</span>
        <span class="${isSub ? 'player-sub' : 'player-name'}">${p.name || '?'}</span>
        ${p.captain ? '<span class="player-captain">C</span>' : ''}
      </div>`;

    return `
      <div class="lineup-team">
        <div class="lineup-team-header">
          ${team?.crest ? `<img src="${team.crest}" class="lineup-team-logo" alt="">` : ''}
          <span class="lineup-team-name">${team?.shortName || team?.name || ''}</span>
          ${formation ? `<span class="lineup-formation-badge">${formation}</span>` : ''}
        </div>
        <div class="lineup-section-label">Starting XI</div>
        ${starters.map(p => playerRow(p)).join('')}
        ${bench.length ? `
          <div class="lineup-section-label" style="margin-top:1rem">Bench</div>
          ${bench.map(p => playerRow(p, true)).join('')}
        ` : ''}
      </div>`;
  }

  function renderBookings(match) {
    const bookings = match.bookings || [];
    if (!bookings.length) return `<div class="empty-section">No cards</div>`;

    return `<div class="bookings-list">${bookings.map(b => {
      const isYellow = b.card === 'YELLOW' || b.card === 'YELLOW_CARD';
      return `
        <div class="booking-item">
          <div class="card-icon ${isYellow ? 'card-yellow' : 'card-red'}"></div>
          <span class="booking-player">${b.player?.name || '?'}</span>
          <span class="booking-team">${b.team?.name || ''}</span>
          <span class="booking-minute">${b.minute}'</span>
        </div>`;
    }).join('')}</div>`;
  }

  function renderSubs(match) {
    const subs = match.substitutions || [];
    if (!subs.length) return `<div class="empty-section">No substitutions recorded</div>`;

    return `<div class="subs-list">${subs.map(s => `
      <div class="sub-item">
        <span class="sub-icon">🔄</span>
        <span><span class="sub-in">↑ ${s.playerIn?.name || '?'}</span></span>
        <span><span class="sub-out">↓ ${s.playerOut?.name || '?'}</span></span>
        <span class="sub-team">${s.team?.name || ''}</span>
        <span class="sub-minute">${s.minute}'</span>
      </div>`).join('')}</div>`;
  }

  function renderPage(match) {
    const homeLineup = match.homeTeam?.lineup || match.lineups?.home || null;
    const awayLineup = match.awayTeam?.lineup || match.lineups?.away || null;

    // football-data.org v4 structure
    const fdHomeLineup = match.homeTeamLineup || null;
    const fdAwayLineup = match.awayTeamLineup || null;
    const hl = fdHomeLineup || homeLineup;
    const al = fdAwayLineup || awayLineup;

    document.getElementById('root').innerHTML = `
      ${renderHero(match)}

      <div class="content">

        <!-- GOALS -->
        <div class="card">
          <div class="card-header">
            <span class="card-header-icon">⚽</span>
            <span class="card-header-title">Goals</span>
          </div>
          <div class="card-body">
            ${renderGoals(match)}
          </div>
        </div>

        <!-- LINEUPS -->
        <div class="card">
          <div class="card-header">
            <span class="card-header-icon">📋</span>
            <span class="card-header-title">Line-ups & Formations</span>
          </div>
          <div class="card-body">
            <div class="lineups-grid">
              ${renderLineupSide(hl, match.homeTeam, 'home')}
              ${renderLineupSide(al, match.awayTeam, 'away')}
            </div>
          </div>
        </div>

        <!-- BOOKINGS -->
        <div class="card">
          <div class="card-header">
            <span class="card-header-icon">🟨</span>
            <span class="card-header-title">Cards</span>
          </div>
          <div class="card-body">
            ${renderBookings(match)}
          </div>
        </div>

        <!-- SUBSTITUTIONS -->
        <div class="card">
          <div class="card-header">
            <span class="card-header-icon">🔄</span>
            <span class="card-header-title">Substitutions</span>
          </div>
          <div class="card-body">
            ${renderSubs(match)}
          </div>
        </div>

      </div>
    `;
  }

  function renderError(msg) {
    document.getElementById('root').innerHTML = `
      <nav style="height:0"></nav>
      <div class="error-box">⚠️ ${msg}</div>`;
  }

  // ─── INIT ──────────────────────────────────────────────────────────────────
  async function init() {
    const matchId = getParam('matchId') || getParam('id');
    if (!matchId) {
      renderError('No match ID in URL. Add ?matchId=XXX to the URL.');
      return;
    }

    try {
      const match = await fetchMatchDetail(matchId);
      renderPage(match);
    } catch (err) {
      renderError(err.message);
    }
  }

  init();
</script>
</body>
</html>
