<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoalIQ · Match Detail</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.back-btn{background:none;border:1px solid rgba(255,255,255,0.12);color:#888;padding:0.35rem 0.9rem;border-radius:6px;cursor:pointer;font-size:0.84rem;margin-bottom:1.2rem;font-family:inherit;transition:all 0.2s}
.back-btn:hover{color:#fff;border-color:#1a7a3c}
.hero{background:linear-gradient(180deg,rgba(26,122,60,0.13) 0%,transparent 100%);border-bottom:1px solid rgba(255,255,255,0.07);padding:2rem 0 1.5rem}
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;margin-bottom:1rem}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:0.5rem}
.hero-logo{width:68px;height:68px;object-fit:contain}
.hero-logo-fb{width:68px;height:68px;border-radius:50%;background:#1a1a26;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:700;color:#aaa}
.hero-name{font-weight:700;font-size:1.1rem;text-align:center;line-height:1.2;color:#f0f0f0}
.hero-formation{font-size:0.75rem;color:#4ade80;font-weight:700;background:rgba(26,122,60,0.2);padding:0.15rem 0.5rem;border-radius:4px}
.hero-score{font-size:3.2rem;font-weight:900;letter-spacing:4px;line-height:1;text-align:center;color:#00e5a0}
.hero-ht{font-size:0.7rem;color:#666;text-align:center;margin-top:0.2rem}
.hero-status{font-size:0.68rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-top:0.25rem;color:#4ade80}
.hero-pills{display:flex;gap:0.55rem;justify-content:center;flex-wrap:wrap;margin-top:0.9rem}
.hero-pill{background:#12121a;border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:0.26rem 0.7rem;font-size:0.72rem;color:#666}
.container{max-width:760px;margin:0 auto;padding:0 1.2rem}
.section-title{font-weight:800;font-size:1rem;letter-spacing:0.5px;margin:1.6rem 0 0.8rem;display:flex;align-items:center;gap:0.5rem;color:#f0f0f0}
.section-title::before{content:'';width:3px;height:1em;background:#1a7a3c;border-radius:2px}
/* GOALS */
.goals-wrap{display:flex;flex-direction:column}
.goal-row{display:grid;grid-template-columns:1fr 54px 1fr;align-items:start;gap:0.4rem;padding:0.55rem 0;border-bottom:1px solid rgba(255,255,255,0.06)}
.goal-row:last-child{border-bottom:none}
.goal-home{text-align:right}.goal-away{text-align:left}
.goal-mid{display:flex;flex-direction:column;align-items:center;gap:0.18rem}
.goal-ball{font-size:0.95rem}
.goal-min{font-size:0.66rem;font-weight:700;color:#4ade80;background:rgba(26,122,60,0.15);padding:0.1rem 0.28rem;border-radius:3px;white-space:nowrap}
.goal-scorer{font-weight:600;font-size:0.84rem;color:#f0f0f0}
.goal-assist{font-size:0.72rem;color:#666;margin-top:0.1rem}
.goal-tag{display:inline-block;font-size:0.6rem;padding:0.07rem 0.25rem;border-radius:3px;margin-left:0.22rem;font-weight:700;vertical-align:middle}
.tag-p{background:rgba(59,130,246,0.18);color:#60a5fa}
.tag-og{background:rgba(239,68,68,0.18);color:#f87171}
.no-data{font-size:0.82rem;color:#555;text-align:center;padding:1.2rem 0}
/* LINEUPS */
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:0.5rem}
@media(max-width:540px){.lineups{grid-template-columns:1fr}}
.lineup-card{background:#12121a;border:1px solid rgba(255,255,255,0.07);border-radius:10px;overflow:hidden}
.lineup-head{background:#1a1a26;padding:0.65rem 0.9rem;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:space-between;gap:0.4rem}
.lineup-team-name{font-weight:700;font-size:0.85rem;color:#f0f0f0}
.lineup-form-badge{background:#1a7a3c;color:#fff;font-size:0.7rem;font-weight:700;padding:0.13rem 0.45rem;border-radius:20px}
.lineup-sec{font-size:0.65rem;color:#555;text-transform:uppercase;letter-spacing:0.5px;padding:0.4rem 0.9rem 0.2rem;font-weight:600}
.player-row{display:flex;align-items:center;gap:0.5rem;padding:0.38rem 0.9rem;border-bottom:1px solid rgba(255,255,255,0.05);font-size:0.81rem}
.player-row:last-child{border-bottom:none}
.player-row:hover{background:#1a1a26}
.player-num{width:20px;height:20px;border-radius:50%;background:#1a1a26;display:flex;align-items:center;justify-content:center;font-size:0.68rem;font-weight:700;flex-shrink:0;color:#4ade80}
.player-name{flex:1;color:#e0e0e0}
.player-pos{font-size:0.63rem;color:#555;background:#0a0a0f;padding:0.07rem 0.3rem;border-radius:3px}
.player-bench .player-name{color:#666}
/* EVENTS */
.events-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2.5rem}
@media(max-width:540px){.events-grid{grid-template-columns:1fr}}
.event-card{background:#12121a;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:0.9rem}
.event-title{font-weight:800;font-size:0.9rem;letter-spacing:0.5px;margin-bottom:0.65rem;color:#f0f0f0}
.event-row{display:flex;align-items:flex-start;gap:0.45rem;font-size:0.8rem;padding:0.32rem 0;border-bottom:1px solid rgba(255,255,255,0.05)}
.event-row:last-child{border-bottom:none}
.event-min{color:#4ade80;font-weight:700;min-width:30px;font-size:0.72rem;flex-shrink:0;padding-top:0.08rem}
.yc{display:inline-block;width:9px;height:13px;background:#fbbf24;border-radius:2px;flex-shrink:0;margin-top:0.1rem}
.rc{display:inline-block;width:9px;height:13px;background:#ef4444;border-radius:2px;flex-shrink:0;margin-top:0.1rem}
/* SPINNER */
.spin-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:0.8rem;color:#555}
.spin{width:32px;height:32px;border:3px solid rgba(255,255,255,0.07);border-top-color:#1a7a3c;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err-box{background:rgba(239,68,68,0.07);border:1px solid rgba(239,68,68,0.2);border-radius:10px;padding:1.2rem;text-align:center;color:#f87171;font-size:0.88rem;margin:2rem 0}
</style>
</head>
<body style="background:#0a0a0f;color:#f0f0f0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh">

<nav style="background:#12121a;border-bottom:1px solid rgba(255,255,255,0.07);padding:0.85rem 1.5rem;display:flex;align-items:center;position:sticky;top:0;z-index:100">
  <a href="index.html" style="font-weight:900;font-size:1.2rem;color:#fbbf24;text-decoration:none;letter-spacing:1px">GOAL<span style="color:#4ade80">IQ</span></a>
</nav>

<div class="hero" id="heroSection">
  <div class="container">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="spin-wrap"><div class="spin"></div><div>Loading match…</div></div>
  </div>
</div>

<div class="container" id="mainContent" style="display:none">
  <div class="section-title">⚽ Goals</div>
  <div id="goalsEl"></div>
  <div class="section-title">👕 Line-ups & Formations</div>
  <div class="lineups" id="lineupsEl"></div>
  <div class="events-grid" id="eventsEl"></div>
</div>

<script>
var API_BASE = 'https://goaliq.onrender.com/api';
var params   = new URLSearchParams(window.location.search);
var matchId  = params.get('id');
var teamId   = params.get('teamId');

async function loadMatch() {
  if (!matchId) { showError('No match ID in URL.'); return; }

  var url = teamId
    ? (API_BASE + '/teams/' + teamId + '/match/' + matchId)
    : (API_BASE + '/matches/' + matchId + '/detail');

  try {
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, 30000);

    var res = await fetch(url, { signal: controller.signal });
    clearTimeout(timer);

    if (!res.ok) {
      var j = await res.json().catch(function(){ return {}; });
      throw new Error(j.error || 'Server error ' + res.status);
    }

    var j   = await res.json();
    var m   = j.match || j;
    renderHero(m);
    renderGoals(m);
    renderLineups(m);
    renderEvents(m);
    document.getElementById('mainContent').style.display = '';
  } catch(e) {
    showError(e.name === 'AbortError' ? 'Request timed out. Try again.' : e.message);
  }
}

function showError(msg) {
  document.getElementById('heroSection').innerHTML =
    '<div class="container"><button class="back-btn" onclick="history.back()">← Back</button>' +
    '<div class="err-box">⚠️ ' + msg + '</div></div>';
}

function renderHero(m) {
  var kd = new Date(m.kickoff);
  var ds = kd.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var fin  = m.status === 'FINISHED';
  var live = m.status === 'IN_PLAY' || m.status === 'PAUSED';

  var scoreBlock = fin
    ? '<div class="hero-score">' + m.score.home + ' – ' + m.score.away + '</div>' +
      (m.score.halfTime && m.score.halfTime.home !== null ? '<div class="hero-ht">HT ' + m.score.halfTime.home + ' – ' + m.score.halfTime.away + '</div>' : '') +
      '<div class="hero-status">Full Time</div>'
    : live
    ? '<div class="hero-score">' + (m.score.home||0) + ' – ' + (m.score.away||0) + '</div><div class="hero-status" style="color:#ef4444">● LIVE</div>'
    : '<div style="font-size:1.3rem;font-weight:700;color:#555;text-align:center">vs</div><div class="hero-status" style="color:#f59e0b">Upcoming</div>';

  function side(t) {
    return '<div class="hero-team">' +
      (t.logo ? '<img src="'+t.logo+'" class="hero-logo" alt="" onerror="this.style.display=\'none\'">' : '<div class="hero-logo-fb">'+t.name[0]+'</div>') +
      '<div class="hero-name">'+t.name+'</div>' +
      (t.formation ? '<div class="hero-formation">'+t.formation+'</div>' : '') +
    '</div>';
  }

  document.getElementById('heroSection').innerHTML =
    '<div class="container">' +
    '<button class="back-btn" onclick="history.back()">← Back</button>' +
    '<div class="hero-teams">' + side(m.homeTeam) + '<div>' + scoreBlock + '</div>' + side(m.awayTeam) + '</div>' +
    '<div class="hero-pills">' +
      '<span class="hero-pill">📅 '+ds+'</span>' +
      (m.matchday ? '<span class="hero-pill">🏟️ Matchday '+m.matchday+'</span>' : '') +
      (m.venue    ? '<span class="hero-pill">📍 '+m.venue+'</span>'   : '') +
      (m.referee  ? '<span class="hero-pill">👨‍⚖️ '+m.referee+'</span>' : '') +
    '</div></div>';
}

function renderGoals(m) {
  var el = document.getElementById('goalsEl');
  if (!m.goals || !m.goals.length) {
    el.innerHTML = '<div class="no-data">No goals recorded.</div>'; return;
  }
  var sorted = m.goals.slice().sort(function(a,b){ return (a.minute||0)-(b.minute||0); });
  el.innerHTML = '<div class="goals-wrap">' + sorted.map(function(g) {
    var isHome = g.teamId ? String(g.teamId) === String(m.homeTeam.id) : g.team === m.homeTeam.name;
    var min    = (g.minute||'?') + "'" + (g.extraTime ? '+'+g.extraTime : '');
    var tag    = g.type==='PENALTY' ? '<span class="goal-tag tag-p">PEN</span>' : g.type==='OWN_GOAL' ? '<span class="goal-tag tag-og">OG</span>' : '';
    var ball   = g.type==='OWN_GOAL' ? '🔴' : '⚽';
    var info   = '<div class="goal-scorer">'+g.scorer+tag+'</div>'+(g.assist?'<div class="goal-assist">🅰 '+g.assist+'</div>':'');
    return '<div class="goal-row">' +
      '<div class="goal-home">'+(isHome?info:'')+'</div>' +
      '<div class="goal-mid"><div class="goal-ball">'+ball+'</div><div class="goal-min">'+min+'</div></div>' +
      '<div class="goal-away">'+(!isHome?info:'')+'</div>' +
    '</div>';
  }).join('') + '</div>';
}

function renderLineups(m) {
  var el = document.getElementById('lineupsEl');
  function side(team) {
    var lu = team.lineup;
    var fm = (lu&&lu.formation) || team.formation || '';
    var head = '<div class="lineup-head"><span class="lineup-team-name">'+team.name+'</span>'+(fm?'<span class="lineup-form-badge">'+fm+'</span>':'')+'</div>';
    if (!lu || !lu.startXI || !lu.startXI.length) return '<div class="lineup-card">'+head+'<div class="no-data">Lineup not available</div></div>';
    var starters = lu.startXI.map(function(p){
      return '<div class="player-row"><div class="player-num">'+(p.shirtNumber||'—')+'</div><div class="player-name">'+p.name+'</div><div class="player-pos">'+(p.position||'')+'</div></div>';
    }).join('');
    var bench = (lu.bench||[]).map(function(p){
      return '<div class="player-row player-bench"><div class="player-num">'+(p.shirtNumber||'—')+'</div><div class="player-name">'+p.name+'</div><div class="player-pos">'+(p.position||'')+'</div></div>';
    }).join('');
    return '<div class="lineup-card">'+head+'<div class="lineup-sec">Starting XI</div>'+starters+(bench?'<div class="lineup-sec">Bench</div>'+bench:'')+'</div>';
  }
  el.innerHTML = side(m.homeTeam) + side(m.awayTeam);
}

function renderEvents(m) {
  var el = document.getElementById('eventsEl');
  var bHtml = (!m.bookings||!m.bookings.length) ? '<div class="no-data">No cards</div>' :
    m.bookings.map(function(b){
      return '<div class="event-row"><span class="event-min">'+(b.minute||'?')+"'</span>"+(b.card==='RED_CARD'?'<span class="rc"></span>':'<span class="yc"></span>')+'<div><div style="font-weight:600;color:#e0e0e0">'+(b.player||'?')+'</div><div style="font-size:0.67rem;color:#555">'+b.team+'</div></div></div>';
    }).join('');
  var sHtml = (!m.substitutions||!m.substitutions.length) ? '<div class="no-data">No substitutions recorded</div>' :
    m.substitutions.map(function(s){
      return '<div class="event-row"><span class="event-min">'+(s.minute||'?')+"'</span><span style='font-size:0.85rem'>🔄</span><div><div style='color:#4ade80;font-weight:600'>▲ "+(s.playerIn||'?')+'</div><div style="color:#f87171">▼ '+(s.playerOut||'?')+'</div><div style="font-size:0.67rem;color:#555">'+s.team+'</div></div></div>';
    }).join('');
  el.innerHTML =
    '<div class="event-card"><div class="event-title">🟨 Cards</div>'+bHtml+'</div>' +
    '<div class="event-card"><div class="event-title">🔄 Substitutions</div>'+sHtml+'</div>';
}

loadMatch();
</script>
</body>
</html>
