!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Match Detail · GoalIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --border: rgba(255,255,255,0.07);
      --accent: #00e5a0;
      --accent2: #7c6fff;
      --text: #f0f0f8;
      --muted: #6b6b88;
      --home-col: #3b8bff;
      --away-col: #ff6b6b;
      --win: #00e5a0;
      --draw: #f0c040;
      --loss: #ff5a5a;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }

    /* NAV */
    nav {
      display:flex; align-items:center; gap:1rem;
      padding:0.9rem 1.5rem;
      background:var(--surface);
      border-bottom:1px solid var(--border);
      position:sticky; top:0; z-index:100;
    }
    .nav-back {
      background:none; border:1px solid var(--border); color:var(--muted);
      cursor:pointer; padding:0.35rem 0.8rem; border-radius:6px;
      font-family:'DM Sans',sans-serif; font-size:0.85rem; transition:all 0.2s;
    }
    .nav-back:hover { color:var(--text); border-color:var(--accent); }
    .nav-logo { font-family:'Bebas Neue',sans-serif; font-size:1.3rem; letter-spacing:0.06em; color:var(--accent); }

    /* HERO */
    .hero {
      background:linear-gradient(160deg,#0d0d1c 0%,#111122 50%,#0d0d1c 100%);
      border-bottom:1px solid var(--border);
      padding:2.5rem 1.5rem 2rem;
      position:relative; overflow:hidden;
    }
    .hero::before {
      content:''; position:absolute; inset:0;
      background:
        radial-gradient(ellipse at 25% 50%, rgba(59,139,255,0.07) 0%, transparent 55%),
        radial-gradient(ellipse at 75% 50%, rgba(255,107,107,0.07) 0%, transparent 55%);
    }
    .hero-inner { position:relative; max-width:680px; margin:0 auto; }

    .comp-badge {
      display:inline-flex; align-items:center; gap:0.4rem;
      background:rgba(255,255,255,0.04); border:1px solid var(--border);
      border-radius:20px; padding:0.28rem 0.75rem;
      font-size:0.75rem; color:var(--muted); letter-spacing:0.04em;
      margin-bottom:1.8rem;
    }
    .comp-badge img { width:15px; height:15px; object-fit:contain; }

    .scoreboard {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; gap:0.8rem;
    }
    .team-side { display:flex; flex-direction:column; align-items:center; gap:0.6rem; }
    .team-crest { width:60px; height:60px; object-fit:contain; }
    .crest-fallback {
      width:60px; height:60px; border-radius:50%;
      background:var(--surface2); border:1px solid var(--border);
      display:flex; align-items:center; justify-content:center;
      font-family:'Bebas Neue',sans-serif; font-size:1.5rem; color:var(--muted);
    }
    .team-name { font-size:0.88rem; font-weight:600; text-align:center; line-height:1.3; }
    .team-formation {
      font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--muted);
      background:var(--surface2); border:1px solid var(--border);
      padding:0.18rem 0.45rem; border-radius:4px;
    }

    .score-center { display:flex; flex-direction:column; align-items:center; gap:0.4rem; }
    .match-status {
      font-size:0.7rem; font-weight:700; letter-spacing:0.12em;
      text-transform:uppercase; padding:0.2rem 0.55rem; border-radius:4px;
    }
    .s-finished { background:rgba(0,229,160,0.1); color:var(--win); }
    .s-live { background:rgba(255,90,90,0.15); color:var(--loss); animation:pulse 1.5s infinite; }
    .s-upcoming { background:rgba(240,192,64,0.1); color:var(--draw); }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }

    .score-nums {
      font-family:'Bebas Neue',sans-serif; font-size:4.5rem;
      line-height:1; letter-spacing:0.04em;
      display:flex; align-items:center; gap:0.15rem;
    }
    .s-h { color:var(--home-col); }
    .s-sep { color:var(--muted); font-size:3rem; }
    .s-a { color:var(--away-col); }
    .ht-score {
      font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--muted);
      background:rgba(255,255,255,0.04); padding:0.18rem 0.5rem; border-radius:4px;
    }
    .match-meta { margin-top:1.2rem; text-align:center; font-size:0.78rem; color:var(--muted); }

    /* CONTENT */
    .content { max-width:680px; margin:0 auto; padding:1.5rem; display:flex; flex-direction:column; gap:1.2rem; }

    /* CARD */
    .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
    .card-head {
      padding:0.85rem 1.2rem; border-bottom:1px solid var(--border);
      display:flex; align-items:center; gap:0.5rem;
    }
    .card-head-icon { font-size:0.95rem; }
    .card-head-title { font-family:'Bebas Neue',sans-serif; font-size:0.98rem; letter-spacing:0.08em; }
    .card-body { padding:1rem 1.2rem; }
    .empty { color:var(--muted); font-size:0.85rem; text-align:center; padding:0.8rem 0; }

    /* GOALS */
    .goals-wrap { display:flex; flex-direction:column; gap:0; }
    .goal-row {
      display:grid; grid-template-columns:1fr 52px 1fr;
      align-items:start; gap:0.4rem;
      padding:0.55rem 0;
      border-bottom:1px solid var(--border);
    }
    .goal-row:last-child { border-bottom:none; }
    .goal-home { text-align:right; }
    .goal-away { text-align:left; }
    .goal-mid { display:flex; flex-direction:column; align-items:center; gap:0.2rem; }
    .goal-ball { font-size:1rem; line-height:1; }
    .goal-min {
      font-family:'DM Mono',monospace; font-size:0.68rem; color:var(--accent);
      background:rgba(0,229,160,0.08); padding:0.12rem 0.3rem; border-radius:3px;
    }
    .goal-scorer { font-size:0.86rem; font-weight:600; }
    .goal-assist { font-size:0.75rem; color:var(--muted); margin-top:0.15rem; }
    .goal-assist span { color:var(--accent2); }
    .tag {
      display:inline-block; font-size:0.62rem; font-weight:700;
      letter-spacing:0.05em; text-transform:uppercase;
      padding:0.1rem 0.28rem; border-radius:3px; margin-left:0.3rem;
      vertical-align:middle;
    }
    .tag-pen { background:rgba(124,111,255,0.15); color:var(--accent2); }
    .tag-og  { background:rgba(255,90,90,0.15); color:var(--loss); }

    /* LINEUPS */
    .lineups-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.2rem; }
    .lu-team-head {
      display:flex; align-items:center; gap:0.45rem;
      padding-bottom:0.6rem; margin-bottom:0.6rem;
      border-bottom:1px solid var(--border);
    }
    .lu-crest { width:20px; height:20px; object-fit:contain; }
    .lu-name { font-size:0.82rem; font-weight:600; }
    .lu-formation {
      margin-left:auto; font-family:'DM Mono',monospace; font-size:0.7rem;
      color:var(--accent); background:rgba(0,229,160,0.07);
      padding:0.12rem 0.38rem; border-radius:4px;
    }
    .lu-section {
      font-size:0.68rem; font-weight:700; letter-spacing:0.1em;
      text-transform:uppercase; color:var(--muted);
      margin:0.65rem 0 0.35rem;
    }
    .player {
      display:flex; align-items:center; gap:0.4rem;
      padding:0.28rem 0.35rem; border-radius:5px;
      transition:background 0.15s;
    }
    .player:hover { background:var(--surface2); }
    .p-num { font-family:'DM Mono',monospace; font-size:0.7rem; color:var(--muted); width:18px; text-align:center; flex-shrink:0; }
    .p-name { font-size:0.8rem; }
    .p-name.bench { color:var(--muted); font-size:0.77rem; }
    .p-cap {
      margin-left:auto; font-size:0.62rem; font-weight:700;
      color:var(--draw); background:rgba(240,192,64,0.12);
      padding:0.08rem 0.28rem; border-radius:3px;
    }

    /* CARDS */
    .bookings-list { display:flex; flex-direction:column; gap:0.5rem; }
    .booking {
      display:flex; align-items:center; gap:0.6rem; font-size:0.84rem;
      padding:0.3rem 0;
    }
    .card-rect { width:11px; height:15px; border-radius:2px; flex-shrink:0; }
    .card-y { background:#f0c040; }
    .card-r { background:#ff3030; }
    .b-player { font-weight:500; }
    .b-team { color:var(--muted); font-size:0.76rem; margin-left:0.2rem; }
    .b-min { font-family:'DM Mono',monospace; font-size:0.73rem; color:var(--muted); margin-left:auto; }

    /* SUBS */
    .subs-list { display:flex; flex-direction:column; gap:0.45rem; }
    .sub { display:flex; align-items:center; gap:0.45rem; font-size:0.83rem; }
    .sub-players { display:flex; flex-direction:column; gap:0.05rem; }
    .sub-in  { color:var(--win); }
    .sub-out { color:var(--loss); }
    .sub-team { color:var(--muted); font-size:0.75rem; margin-left:auto; }
    .sub-min { font-family:'DM Mono',monospace; font-size:0.73rem; color:var(--muted); }

    /* LOADING */
    .loading {
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; padding:5rem 2rem; gap:1rem; color:var(--muted);
    }
    .spinner {
      width:34px; height:34px; border:3px solid var(--border);
      border-top-color:var(--accent); border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .err-box {
      background:rgba(255,90,90,0.07); border:1px solid rgba(255,90,90,0.2);
      border-radius:10px; padding:1.5rem; text-align:center;
      color:var(--loss); font-size:0.9rem; margin:2rem 1.5rem;
    }

    @media(max-width:500px){
      .score-nums { font-size:3.2rem; }
      .team-crest,.crest-fallback { width:46px; height:46px; }
      .lineups-grid { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<nav>
  <button class="nav-back" onclick="history.back()">← Back</button>
  <span class="nav-logo">GoalIQ</span>
</nav>

<div id="root">
  <div class="loading">
    <div class="spinner"></div>
    <div>Loading match…</div>
  </div>
</div>

<script>
  const API = window.location.hostname === 'localhost'
    ? 'http://localhost:5000/api'
    : 'https://goaliq.onrender.com/api';

  function param(k) { return new URLSearchParams(window.location.search).get(k); }

  function crest(url, name, cls='team-crest') {
    const ini = (name||'?')[0].toUpperCase();
    if (!url) return `<div class="crest-fallback">${ini}</div>`;
    return `<img src="${url}" class="${cls}" alt="${name}" onerror="this.outerHTML='<div class=\\"crest-fallback\\">${ini}</div>'">`;
  }

  function fmtDate(str) {
    if (!str) return '';
    const d = new Date(str);
    return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'})
      + ' · ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  }

  function statusBadge(s) {
    if (!s) return '';
    const map = {
      FINISHED:['s-finished','FT'], AWARDED:['s-finished','FT'],
      IN_PLAY:['s-live','● LIVE'], PAUSED:['s-live','HT'],
      TIMED:['s-upcoming','UPCOMING'], SCHEDULED:['s-upcoming','UPCOMING'],
    };
    const [cls,lbl] = map[s.toUpperCase()] || ['s-upcoming', s];
    return `<span class="match-status ${cls}">${lbl}</span>`;
  }

  // ── Fetch match detail via backend proxy ──────────────────────────────────
  async function fetchDetail(matchId) {
    // matchId here is the football-data.org numeric ID
    const res = await fetch(`${API}/matches/${matchId}/detail`);
    if (!res.ok) {
      const j = await res.json().catch(()=>({}));
      throw new Error(j.error || `HTTP ${res.status}`);
    }
    const j = await res.json();
    return j.match || j;
  }

  // ── RENDER ────────────────────────────────────────────────────────────────

  function renderHero(m) {
    const h = m.homeTeam, a = m.awayTeam;
    const hG = m.score?.fullTime?.home ?? '–';
    const aG = m.score?.fullTime?.away ?? '–';
    const htH = m.score?.halfTime?.home;
    const htA = m.score?.halfTime?.away;
    const htStr = htH != null && htA != null ? `HT ${htH}–${htA}` : '';
    const hFm = m.homeTeamLineup?.formation || '';
    const aFm = m.awayTeamLineup?.formation || '';

    return `
    <div class="hero">
      <div class="hero-inner">
        <div class="comp-badge">
          ${m.competition?.emblem ? `<img src="${m.competition.emblem}" alt="">` : ''}
          ${m.competition?.name || 'Premier League'}
          ${m.matchday ? ` · Matchday ${m.matchday}` : ''}
        </div>
        <div class="scoreboard">
          <div class="team-side">
            ${crest(h?.crest, h?.name)}
            <div class="team-name">${h?.name || '–'}</div>
            ${hFm ? `<div class="team-formation">${hFm}</div>` : ''}
          </div>
          <div class="score-center">
            ${statusBadge(m.status)}
            <div class="score-nums">
              <span class="s-h">${hG}</span>
              <span class="s-sep">:</span>
              <span class="s-a">${aG}</span>
            </div>
            ${htStr ? `<div class="ht-score">${htStr}</div>` : ''}
          </div>
          <div class="team-side">
            ${crest(a?.crest, a?.name)}
            <div class="team-name">${a?.name || '–'}</div>
            ${aFm ? `<div class="team-formation">${aFm}</div>` : ''}
          </div>
        </div>
        <div class="match-meta">${fmtDate(m.utcDate)}${m.venue ? ` · ${m.venue}` : ''}</div>
      </div>
    </div>`;
  }

  function renderGoals(m) {
    const goals = m.goals || [];
    if (!goals.length) return `<div class="empty">No goals recorded</div>`;

    const homeId = m.homeTeam?.id;
    const rows = goals.map(g => {
      const isHome = g.team?.id === homeId;
      const min = g.minute + (g.injuryTime ? `+${g.injuryTime}` : '') + `'`;
      const isPen = g.type === 'PENALTY';
      const isOG  = g.type === 'OWN_GOAL';
      const tag   = isPen ? `<span class="tag tag-pen">PEN</span>`
                  : isOG  ? `<span class="tag tag-og">OG</span>` : '';
      const ball  = isOG ? '🔴' : '⚽';

      const cell = `
        <div class="goal-scorer">${g.scorer?.name || '?'}${tag}</div>
        ${g.assist?.name ? `<div class="goal-assist"><span>🅰</span> ${g.assist.name}</div>` : ''}`;

      return `
        <div class="goal-row">
          <div class="goal-home">${isHome ? cell : ''}</div>
          <div class="goal-mid">
            <div class="goal-ball">${ball}</div>
            <div class="goal-min">${min}</div>
          </div>
          <div class="goal-away">${!isHome ? cell : ''}</div>
        </div>`;
    });

    return `<div class="goals-wrap">${rows.join('')}</div>`;
  }

  function renderLineupSide(lineup, team) {
    if (!lineup?.startXI?.length) return `<div class="empty">Lineup not available</div>`;

    const starters = lineup.startXI.map(p => p.player || p);
    const bench    = (lineup.bench || []).map(p => p.player || p);
    const fm       = lineup.formation || '';

    const row = (p, isBench=false) => `
      <div class="player">
        <span class="p-num">${p.shirtNumber || ''}</span>
        <span class="p-name${isBench?' bench':''}">${p.name || '?'}</span>
        ${p.captain ? '<span class="p-cap">C</span>' : ''}
      </div>`;

    return `
      <div>
        <div class="lu-team-head">
          ${team?.crest ? `<img src="${team.crest}" class="lu-crest" alt="">` : ''}
          <span class="lu-name">${team?.shortName || team?.name || ''}</span>
          ${fm ? `<span class="lu-formation">${fm}</span>` : ''}
        </div>
        <div class="lu-section">Starting XI</div>
        ${starters.map(p => row(p)).join('')}
        ${bench.length ? `
          <div class="lu-section" style="margin-top:0.8rem">Bench</div>
          ${bench.map(p => row(p, true)).join('')}
        ` : ''}
      </div>`;
  }

  function renderBookings(m) {
    const b = m.bookings || [];
    if (!b.length) return `<div class="empty">No cards</div>`;
    return `<div class="bookings-list">${b.map(x => {
      const isY = x.card?.includes('YELLOW');
      return `
        <div class="booking">
          <div class="card-rect ${isY?'card-y':'card-r'}"></div>
          <span class="b-player">${x.player?.name || '?'}</span>
          <span class="b-team">${x.team?.name || ''}</span>
          <span class="b-min">${x.minute}'</span>
        </div>`;
    }).join('')}</div>`;
  }

  function renderSubs(m) {
    const s = m.substitutions || [];
    if (!s.length) return `<div class="empty">No substitutions recorded</div>`;
    return `<div class="subs-list">${s.map(x => `
      <div class="sub">
        <span>🔄</span>
        <div class="sub-players">
          <span class="sub-in">↑ ${x.playerIn?.name || '?'}</span>
          <span class="sub-out">↓ ${x.playerOut?.name || '?'}</span>
        </div>
        <span class="sub-team">${x.team?.name || ''}</span>
        <span class="sub-min">${x.minute}'</span>
      </div>`).join('')}</div>`;
  }

  function renderPage(m) {
    const hl = m.homeTeamLineup || null;
    const al = m.awayTeamLineup || null;

    document.getElementById('root').innerHTML = `
      ${renderHero(m)}
      <div class="content">

        <div class="card">
          <div class="card-head">
            <span class="card-head-icon">⚽</span>
            <span class="card-head-title">Goals</span>
          </div>
          <div class="card-body">${renderGoals(m)}</div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-head-icon">📋</span>
            <span class="card-head-title">Line-ups & Formations</span>
          </div>
          <div class="card-body">
            <div class="lineups-grid">
              ${renderLineupSide(hl, m.homeTeam)}
              ${renderLineupSide(al, m.awayTeam)}
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-head-icon">🟨</span>
            <span class="card-head-title">Cards</span>
          </div>
          <div class="card-body">${renderBookings(m)}</div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-head-icon">🔄</span>
            <span class="card-head-title">Substitutions</span>
          </div>
          <div class="card-body">${renderSubs(m)}</div>
        </div>

      </div>`;
  }

  async function init() {
    // id from URL is the football-data.org numeric match ID
    const matchId = param('id') || param('matchId');
    if (!matchId) {
      document.getElementById('root').innerHTML =
        `<div class="err-box">⚠️ No match ID in URL.</div>`;
      return;
    }
    try {
      const match = await fetchDetail(matchId);
      renderPage(match);
    } catch (err) {
      document.getElementById('root').innerHTML =
        `<div class="err-box">⚠️ ${err.message}</div>`;
    }
  }

  init();
</script>
</body>
</html>
