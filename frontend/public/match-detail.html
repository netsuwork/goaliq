<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoalIQ - Match Detail</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.hero{background:linear-gradient(180deg,rgba(26,122,60,0.15) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:2rem 0 1.5rem}
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;margin-bottom:1rem}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:0.5rem}
.hero-logo{width:72px;height:72px;object-fit:contain}
.hero-logo-fb{width:72px;height:72px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.8rem}
.hero-name{font-family:var(--font-head);font-size:1.4rem;text-align:center}
.hero-formation{font-size:0.8rem;color:var(--green-l);font-weight:600}
.hero-score{font-family:var(--font-head);font-size:3rem;color:var(--accent);letter-spacing:4px;line-height:1;text-align:center}
.hero-ht{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:0.25rem}
.hero-pills{display:flex;gap:0.75rem;justify-content:center;flex-wrap:wrap;margin-top:0.75rem}
.hero-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0.3rem 0.8rem;font-size:0.75rem;color:var(--muted)}
.section-title{font-family:var(--font-head);font-size:1.1rem;letter-spacing:0.5px;margin:1.5rem 0 0.75rem;display:flex;align-items:center;gap:0.5rem}
.section-title::before{content:'';width:3px;height:1.1em;background:var(--green-l);border-radius:2px}
.goal-row{display:grid;grid-template-columns:1fr 60px 1fr;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
.goal-home{text-align:right}
.goal-away{text-align:left}
.goal-min{text-align:center;background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:0.25rem 0.4rem;font-size:0.75rem;font-weight:700;color:var(--accent)}
.goal-scorer{font-weight:600;font-size:0.85rem}
.goal-assist{font-size:0.72rem;color:var(--muted)}
.goal-tag{display:inline-block;font-size:0.65rem;padding:0.1rem 0.35rem;border-radius:3px;margin-left:0.25rem}
.goal-tag.p{background:rgba(59,130,246,0.2);color:#60a5fa}
.goal-tag.og{background:rgba(232,65,66,0.2);color:var(--red)}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1.5rem}
@media(max-width:600px){.lineups{grid-template-columns:1fr}}
.lineup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lineup-head{background:var(--surface2);padding:0.75rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.lineup-team{font-weight:700;font-size:0.9rem}
.lineup-form{background:var(--green);color:#fff;font-size:0.75rem;font-weight:700;padding:0.2rem 0.6rem;border-radius:20px}
.lineup-sec{font-size:0.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:0.5rem 1rem 0.25rem;font-weight:600}
.player{display:flex;align-items:center;gap:0.6rem;padding:0.5rem 1rem;border-bottom:1px solid var(--border);font-size:0.84rem}
.player:last-child{border-bottom:none}
.player:hover{background:var(--surface2)}
.player-num{width:24px;height:24px;border-radius:50%;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0;color:var(--accent)}
.player-name{flex:1;font-weight:500}
.player-pos{font-size:0.68rem;color:var(--muted);background:var(--bg);padding:0.1rem 0.4rem;border-radius:3px}
.player.bench{opacity:0.7}
.events{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem}
@media(max-width:600px){.events{grid-template-columns:1fr}}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.event-title{font-family:var(--font-head);font-size:1rem;letter-spacing:0.5px;margin-bottom:0.75rem}
.event-row{display:flex;align-items:center;gap:0.5rem;font-size:0.82rem;padding:0.35rem 0;border-bottom:1px solid var(--border)}
.event-row:last-child{border-bottom:none}
.event-min{color:var(--accent);font-weight:700;min-width:35px;font-size:0.75rem}
.yc{display:inline-block;width:10px;height:14px;background:#fbbf24;border-radius:2px}
.rc{display:inline-block;width:10px;height:14px;background:var(--red);border-radius:2px}
.no-data{font-size:0.82rem;color:var(--muted);text-align:center;padding:1rem}
</style>
</head>
<body>
<nav class="navbar">
<div class="container navbar-inner">
<a href="index.html" class="logo">GOAL<span>IQ</span></a>
<div id="authArea"></div>
</div>
</nav>

<div class="hero" id="heroSection">
<div class="container">
<button class="back-btn" onclick="history.back()">← Back</button>
<div class="loading-state"><div class="spinner"></div><p>Loading match...</p></div>
</div>
</div>

<main class="container" id="mainContent" style="display:none">
<div class="section-title">⚽ Goals</div>
<div id="goalsEl"></div>
<div class="section-title">👕 Line-ups</div>
<div class="lineups" id="lineupsEl"></div>
<div class="events" id="eventsEl"></div>
</main>

<div id="toast"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
var p = new URLSearchParams(window.location.search);
var matchId = p.get('id');
var teamId = p.get('teamId');

document.addEventListener('DOMContentLoaded', async function() {
  await Auth.init();
  if (!matchId) return;
  try {
    var data = await api._fetch('/teams/' + teamId + '/match/' + matchId);
    var m = data.match;
    renderHero(m);
    renderGoals(m);
    renderLineups(m);
    renderEvents(m);
    document.getElementById('mainContent').style.display = '';
  } catch(e) {
    document.getElementById('heroSection').innerHTML = '<div class="container"><button class="back-btn" onclick="history.back()">← Back</button><div class="error-state">⚠️ ' + e.message + '</div></div>';
  }
});

function renderHero(m) {
  var kd = new Date(m.kickoff);
  var ds = kd.toLocaleString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'});
  var fin = m.status === 'FINISHED';
  var scoreHtml = fin
    ? '<div class="hero-score">' + m.score.home + ' \u2013 ' + m.score.away + '</div>' +
      (m.score.halfTime && m.score.halfTime.home !== null ? '<div class="hero-ht">HT: ' + m.score.halfTime.home + ' \u2013 ' + m.score.halfTime.away + '</div>' : '') +
      '<div style="text-align:center;font-size:0.72rem;color:var(--muted);margin-top:0.2rem">Full Time</div>'
    : '<div class="hero-score" style="font-size:1.5rem;color:var(--muted)">vs</div>';

  document.getElementById('heroSection').innerHTML =
    '<div class="container">' +
    '<button class="back-btn" onclick="history.back()">← Back</button>' +
    '<div class="hero-teams">' +
      '<div class="hero-team">' +
        (m.homeTeam.logo ? '<img src="'+m.homeTeam.logo+'" class="hero-logo" onerror="this.style.display=\'none\'">' : '<div class="hero-logo-fb">'+m.homeTeam.name[0]+'</div>') +
        '<div class="hero-name">' + m.homeTeam.name + '</div>' +
        (m.homeTeam.formation ? '<div class="hero-formation">' + m.homeTeam.formation + '</div>' : '') +
      '</div>' +
      '<div>' + scoreHtml + '</div>' +
      '<div class="hero-team">' +
        (m.awayTeam.logo ? '<img src="'+m.awayTeam.logo+'" class="hero-logo" onerror="this.style.display=\'none\'">' : '<div class="hero-logo-fb">'+m.awayTeam.name[0]+'</div>') +
        '<div class="hero-name">' + m.awayTeam.name + '</div>' +
        (m.awayTeam.formation ? '<div class="hero-formation">' + m.awayTeam.formation + '</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="hero-pills">' +
      '<span class="hero-pill">📅 ' + ds + '</span>' +
      '<span class="hero-pill">🏟️ Matchday ' + (m.matchday||'—') + '</span>' +
      (m.venue ? '<span class="hero-pill">📍 ' + m.venue + '</span>' : '') +
      (m.referee ? '<span class="hero-pill">👨‍⚖️ ' + m.referee + '</span>' : '') +
    '</div>' +
    '</div>';
}

function renderGoals(m) {
  var el = document.getElementById('goalsEl');
  if (!m.goals || !m.goals.length) {
    el.innerHTML = '<div class="no-data">No goals recorded.</div>';
    return;
  }
  var sorted = m.goals.slice().sort(function(a,b){ return (a.minute||0)-(b.minute||0); });
  el.innerHTML = sorted.map(function(g) {
    var isHome = g.teamId === m.homeTeam.id || g.team === m.homeTeam.name;
    var tag = g.type === 'PENALTY' ? '<span class="goal-tag p">P</span>' : g.type === 'OWN_GOAL' ? '<span class="goal-tag og">OG</span>' : '';
    var info = '<div class="goal-scorer">⚽ ' + g.scorer + tag + '</div>' + (g.assist ? '<div class="goal-assist">🅰️ ' + g.assist + '</div>' : '');
    return '<div class="goal-row">' +
      '<div class="goal-home">' + (isHome ? info : '') + '</div>' +
      '<div class="goal-min">' + (g.minute||'?') + "'" + (g.extraTime ? '+'+g.extraTime : '') + '</div>' +
      '<div class="goal-away">' + (!isHome ? info : '') + '</div>' +
    '</div>';
  }).join('');
}

function renderLineups(m) {
  var el = document.getElementById('lineupsEl');
  el.innerHTML = [m.homeTeam, m.awayTeam].map(function(team) {
    var lu = team.lineup;
    if (!lu || (!lu.startXI || !lu.startXI.length)) {
      return '<div class="lineup-card"><div class="lineup-head"><span class="lineup-team">' + team.name + '</span>' +
        (team.formation ? '<span class="lineup-form">' + team.formation + '</span>' : '') + '</div>' +
        '<div class="no-data">Lineup not available.</div></div>';
    }
    var starters = lu.startXI.map(function(p) {
      return '<div class="player"><div class="player-num">' + (p.shirtNumber||'—') + '</div><div class="player-name">' + p.name + '</div><div class="player-pos">' + (p.position||'') + '</div></div>';
    }).join('');
    var bench = (lu.bench||[]).map(function(p) {
      return '<div class="player bench"><div class="player-num">' + (p.shirtNumber||'—') + '</div><div class="player-name">' + p.name + '</div><div class="player-pos">' + (p.position||'') + '</div></div>';
    }).join('');
    return '<div class="lineup-card">' +
      '<div class="lineup-head"><span class="lineup-team">' + team.name + '</span>' +
      (lu.formation||team.formation ? '<span class="lineup-form">' + (lu.formation||team.formation) + '</span>' : '') + '</div>' +
      '<div class="lineup-sec">Starting XI</div>' + starters +
      (bench ? '<div class="lineup-sec">Bench</div>' + bench : '') +
    '</div>';
  }).join('');
}

function renderEvents(m) {
  var el = document.getElementById('eventsEl');
  var bHtml = (!m.bookings || !m.bookings.length) ? '<div class="no-data">No cards</div>' :
    m.bookings.map(function(b) {
      return '<div class="event-row"><span class="event-min">' + b.minute + "'</span>" +
        (b.card === 'RED_CARD' ? '<span class="rc"></span>' : '<span class="yc"></span>') +
        '<div><div style="font-weight:600">' + b.player + '</div><div style="font-size:0.68rem;color:var(--muted)">' + b.team + '</div></div></div>';
    }).join('');

  var sHtml = (!m.substitutions || !m.substitutions.length) ? '<div class="no-data">No substitutions recorded</div>' :
    m.substitutions.map(function(s) {
      return '<div class="event-row"><span class="event-min">' + s.minute + "'</span><span>🔄</span>" +
        '<div><div style="color:var(--green-l);font-weight:600">▲ ' + s.playerIn + '</div>' +
        '<div style="color:var(--red)">▼ ' + s.playerOut + '</div>' +
        '<div style="font-size:0.68rem;color:var(--muted)">' + s.team + '</div></div></div>';
    }).join('');

  el.innerHTML =
    '<div class="event-card"><div class="event-title">🟨 Bookings</div>' + bHtml + '</div>' +
    '<div class="event-card"><div class="event-title">🔄 Substitutions</div>' + sHtml + '</div>';
}

function showToast(msg,type) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show ' + (type||'info');
  setTimeout(function(){ t.classList.remove('show'); }, 3500);
}
</script>
</body>
</html>
