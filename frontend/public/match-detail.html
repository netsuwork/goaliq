<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GoalIQ · Match Detail</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.hero{background:linear-gradient(180deg,rgba(26,122,60,0.15) 0%,transparent 100%);border-bottom:1px solid var(--border);padding:2rem 0 1.5rem}
.back-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:0.35rem 0.9rem;border-radius:6px;cursor:pointer;font-size:0.84rem;margin-bottom:1.2rem;font-family:inherit;transition:all 0.2s}
.back-btn:hover{color:var(--text);border-color:var(--green-l)}
.hero-teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1.5rem;margin-bottom:1rem}
.hero-team{display:flex;flex-direction:column;align-items:center;gap:0.5rem}
.hero-logo{width:72px;height:72px;object-fit:contain}
.hero-logo-fb{width:72px;height:72px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:1.8rem;font-weight:700}
.hero-name{font-family:var(--font-head);font-size:1.3rem;text-align:center;line-height:1.2}
.hero-formation{font-size:0.78rem;color:var(--green-l);font-weight:700;background:rgba(26,122,60,0.15);padding:0.15rem 0.5rem;border-radius:4px}
.hero-score{font-family:var(--font-head);font-size:3.5rem;color:var(--accent);letter-spacing:4px;line-height:1;text-align:center}
.hero-ht{font-size:0.72rem;color:var(--muted);text-align:center;margin-top:0.25rem}
.hero-status{font-size:0.7rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-align:center;margin-top:0.3rem}
.status-ft{color:var(--green-l)}
.status-live{color:#ef4444;animation:pulse 1.5s infinite}
.status-up{color:#f59e0b}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.hero-pills{display:flex;gap:0.6rem;justify-content:center;flex-wrap:wrap;margin-top:0.9rem}
.hero-pill{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:0.28rem 0.75rem;font-size:0.74rem;color:var(--muted)}

.section-title{font-family:var(--font-head);font-size:1.05rem;letter-spacing:0.5px;margin:1.5rem 0 0.75rem;display:flex;align-items:center;gap:0.5rem}
.section-title::before{content:'';width:3px;height:1.1em;background:var(--green-l);border-radius:2px}

/* GOALS */
.goals-wrap{display:flex;flex-direction:column;gap:0}
.goal-row{display:grid;grid-template-columns:1fr 56px 1fr;align-items:start;gap:0.4rem;padding:0.55rem 0;border-bottom:1px solid var(--border)}
.goal-row:last-child{border-bottom:none}
.goal-home{text-align:right}
.goal-away{text-align:left}
.goal-mid{display:flex;flex-direction:column;align-items:center;gap:0.2rem}
.goal-ball{font-size:1rem}
.goal-min{font-size:0.68rem;font-weight:700;color:var(--green-l);background:rgba(26,122,60,0.12);padding:0.12rem 0.3rem;border-radius:3px;white-space:nowrap}
.goal-scorer{font-weight:600;font-size:0.85rem}
.goal-assist{font-size:0.73rem;color:var(--muted);margin-top:0.1rem}
.goal-tag{display:inline-block;font-size:0.62rem;padding:0.08rem 0.28rem;border-radius:3px;margin-left:0.25rem;font-weight:700;vertical-align:middle}
.tag-p{background:rgba(59,130,246,0.18);color:#60a5fa}
.tag-og{background:rgba(232,65,66,0.18);color:#f87171}
.no-data{font-size:0.82rem;color:var(--muted);text-align:center;padding:1rem}

/* LINEUPS */
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:0.5rem}
@media(max-width:580px){.lineups{grid-template-columns:1fr}}
.lineup-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.lineup-head{background:var(--surface2);padding:0.7rem 1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:0.5rem}
.lineup-team{font-weight:700;font-size:0.88rem}
.lineup-form{background:var(--green);color:#fff;font-size:0.72rem;font-weight:700;padding:0.15rem 0.5rem;border-radius:20px}
.lineup-sec{font-size:0.67rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;padding:0.45rem 1rem 0.2rem;font-weight:600}
.player-row{display:flex;align-items:center;gap:0.55rem;padding:0.42rem 1rem;border-bottom:1px solid var(--border);font-size:0.83rem}
.player-row:last-child{border-bottom:none}
.player-row:hover{background:var(--surface2)}
.player-num{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700;flex-shrink:0;color:var(--green-l)}
.player-name{flex:1;font-weight:500}
.player-pos{font-size:0.66rem;color:var(--muted);background:var(--bg);padding:0.08rem 0.35rem;border-radius:3px}
.player-bench{opacity:0.65}

/* EVENTS GRID */
.events-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem}
@media(max-width:580px){.events-grid{grid-template-columns:1fr}}
.event-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem}
.event-title{font-family:var(--font-head);font-size:0.95rem;letter-spacing:0.5px;margin-bottom:0.7rem}
.event-row{display:flex;align-items:flex-start;gap:0.5rem;font-size:0.81rem;padding:0.35rem 0;border-bottom:1px solid var(--border)}
.event-row:last-child{border-bottom:none}
.event-min{color:var(--green-l);font-weight:700;min-width:32px;font-size:0.74rem;flex-shrink:0;padding-top:0.1rem}
.yc{display:inline-block;width:10px;height:14px;background:#fbbf24;border-radius:2px;flex-shrink:0;margin-top:0.1rem}
.rc{display:inline-block;width:10px;height:14px;background:#ef4444;border-radius:2px;flex-shrink:0;margin-top:0.1rem}
</style>
</head>
<body>
<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo">GOAL<span>IQ</span></a>
    <div id="authArea"></div>
  </div>
</nav>

<div class="hero" id="heroSection">
  <div class="container">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <div class="loading-state"><div class="spinner"></div><p>Loading match…</p></div>
  </div>
</div>

<main class="container" id="mainContent" style="display:none">
  <div class="section-title">⚽ Goals</div>
  <div id="goalsEl"></div>

  <div class="section-title">👕 Line-ups & Formations</div>
  <div class="lineups" id="lineupsEl"></div>

  <div class="events-grid" id="eventsEl"></div>
</main>

<div id="toast"></div>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
  var params  = new URLSearchParams(window.location.search);
  var matchId = params.get('id');
  var teamId  = params.get('teamId');

  var API_BASE = window.location.hostname === 'localhost'
    ? 'http://localhost:5000/api'
    : 'https://goaliq.onrender.com/api';

  async function fetchMatch() {
    // If we have teamId use the teams route (richer data with AF enrichment)
    var url = teamId
      ? API_BASE + '/teams/' + teamId + '/match/' + matchId
      : API_BASE + '/matches/' + matchId + '/detail';

    var res = await fetch(url);
    if (!res.ok) {
      var j = await res.json().catch(function(){ return {}; });
      throw new Error(j.error || 'HTTP ' + res.status);
    }
    var j = await res.json();
    return j.match || j;
  }

  document.addEventListener('DOMContentLoaded', async function() {
    if (window.Auth) await Auth.init();

    if (!matchId) {
      document.getElementById('heroSection').innerHTML =
        '<div class="container"><button class="back-btn" onclick="history.back()">← Back</button>' +
        '<div class="error-state">No match ID in URL.</div></div>';
      return;
    }

    try {
      var m = await fetchMatch();
      renderHero(m);
      renderGoals(m);
      renderLineups(m);
      renderEvents(m);
      document.getElementById('mainContent').style.display = '';
    } catch(e) {
      document.getElementById('heroSection').innerHTML =
        '<div class="container"><button class="back-btn" onclick="history.back()">← Back</button>' +
        '<div class="error-state">⚠️ ' + e.message + '</div></div>';
    }
  });

  function renderHero(m) {
    var kd = new Date(m.kickoff);
    var ds = kd.toLocaleString('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit' });
    var fin = m.status === 'FINISHED';
    var live = m.status === 'IN_PLAY' || m.status === 'PAUSED';

    var scoreHtml;
    if (fin) {
      scoreHtml =
        '<div class="hero-score">' + m.score.home + ' – ' + m.score.away + '</div>' +
        (m.score.halfTime && m.score.halfTime.home !== null
          ? '<div class="hero-ht">HT: ' + m.score.halfTime.home + ' – ' + m.score.halfTime.away + '</div>'
          : '') +
        '<div class="hero-status status-ft">Full Time</div>';
    } else if (live) {
      scoreHtml =
        '<div class="hero-score">' + (m.score.home||0) + ' – ' + (m.score.away||0) + '</div>' +
        '<div class="hero-status status-live">● Live</div>';
    } else {
      scoreHtml = '<div class="hero-score" style="font-size:1.4rem;color:var(--muted)">vs</div>' +
        '<div class="hero-status status-up">Upcoming</div>';
    }

    function teamHtml(team) {
      return '<div class="hero-team">' +
        (team.logo
          ? '<img src="' + team.logo + '" class="hero-logo" alt="" onerror="this.style.display=\'none\'">'
          : '<div class="hero-logo-fb">' + team.name[0] + '</div>') +
        '<div class="hero-name">' + team.name + '</div>' +
        (team.formation ? '<div class="hero-formation">' + team.formation + '</div>' : '') +
      '</div>';
    }

    document.getElementById('heroSection').innerHTML =
      '<div class="container">' +
      '<button class="back-btn" onclick="history.back()">← Back</button>' +
      '<div class="hero-teams">' + teamHtml(m.homeTeam) + '<div>' + scoreHtml + '</div>' + teamHtml(m.awayTeam) + '</div>' +
      '<div class="hero-pills">' +
        '<span class="hero-pill">📅 ' + ds + '</span>' +
        '<span class="hero-pill">🏟️ Matchday ' + (m.matchday || '—') + '</span>' +
        (m.venue   ? '<span class="hero-pill">📍 ' + m.venue   + '</span>' : '') +
        (m.referee ? '<span class="hero-pill">👨‍⚖️ ' + m.referee + '</span>' : '') +
      '</div>' +
      '</div>';
  }

  function renderGoals(m) {
    var el = document.getElementById('goalsEl');
    if (!m.goals || !m.goals.length) {
      el.innerHTML = '<div class="no-data">No goals recorded.</div>';
      return;
    }

    var sorted = m.goals.slice().sort(function(a,b){ return (a.minute||0) - (b.minute||0); });

    el.innerHTML = '<div class="goals-wrap">' + sorted.map(function(g) {
      // Determine if home goal
      var isHome = g.teamId
        ? (String(g.teamId) === String(m.homeTeam.id))
        : (g.team === m.homeTeam.name);

      var minStr = (g.minute || '?') + "'" + (g.extraTime ? '+' + g.extraTime : '');
      var tag = g.type === 'PENALTY'   ? '<span class="goal-tag tag-p">PEN</span>'
              : g.type === 'OWN_GOAL'  ? '<span class="goal-tag tag-og">OG</span>'
              : '';
      var ball = g.type === 'OWN_GOAL' ? '🔴' : '⚽';

      var info = '<div class="goal-scorer">' + g.scorer + tag + '</div>' +
        (g.assist ? '<div class="goal-assist">🅰 ' + g.assist + '</div>' : '');

      return '<div class="goal-row">' +
        '<div class="goal-home">' + (isHome ? info : '') + '</div>' +
        '<div class="goal-mid"><div class="goal-ball">' + ball + '</div><div class="goal-min">' + minStr + '</div></div>' +
        '<div class="goal-away">' + (!isHome ? info : '') + '</div>' +
      '</div>';
    }).join('') + '</div>';
  }

  function renderLineups(m) {
    var el = document.getElementById('lineupsEl');

    function buildSide(team) {
      var lu = team.lineup;
      var hasLineup = lu && lu.startXI && lu.startXI.length;

      var headHtml = '<div class="lineup-head">' +
        '<span class="lineup-team">' + team.name + '</span>' +
        (team.formation || (lu && lu.formation) ? '<span class="lineup-form">' + (lu && lu.formation ? lu.formation : team.formation) + '</span>' : '') +
        '</div>';

      if (!hasLineup) {
        return '<div class="lineup-card">' + headHtml + '<div class="no-data">Lineup not available</div></div>';
      }

      var starters = lu.startXI.map(function(p) {
        return '<div class="player-row"><div class="player-num">' + (p.shirtNumber || '—') + '</div>' +
          '<div class="player-name">' + p.name + '</div>' +
          '<div class="player-pos">' + (p.position || '') + '</div></div>';
      }).join('');

      var bench = (lu.bench || []).map(function(p) {
        return '<div class="player-row player-bench"><div class="player-num">' + (p.shirtNumber || '—') + '</div>' +
          '<div class="player-name">' + p.name + '</div>' +
          '<div class="player-pos">' + (p.position || '') + '</div></div>';
      }).join('');

      return '<div class="lineup-card">' + headHtml +
        '<div class="lineup-sec">Starting XI</div>' + starters +
        (bench ? '<div class="lineup-sec">Bench</div>' + bench : '') +
        '</div>';
    }

    el.innerHTML = buildSide(m.homeTeam) + buildSide(m.awayTeam);
  }

  function renderEvents(m) {
    var el = document.getElementById('eventsEl');

    // Cards
    var bHtml = (!m.bookings || !m.bookings.length)
      ? '<div class="no-data">No cards</div>'
      : m.bookings.map(function(b) {
          return '<div class="event-row">' +
            '<span class="event-min">' + (b.minute || '?') + "'" + '</span>' +
            (b.card === 'RED_CARD' ? '<span class="rc"></span>' : '<span class="yc"></span>') +
            '<div><div style="font-weight:600">' + (b.player || '?') + '</div>' +
            '<div style="font-size:0.68rem;color:var(--muted)">' + b.team + '</div></div>' +
          '</div>';
        }).join('');

    // Subs
    var sHtml = (!m.substitutions || !m.substitutions.length)
      ? '<div class="no-data">No substitutions recorded</div>'
      : m.substitutions.map(function(s) {
          return '<div class="event-row">' +
            '<span class="event-min">' + (s.minute || '?') + "'" + '</span>' +
            '<span style="font-size:0.9rem">🔄</span>' +
            '<div>' +
              '<div style="color:var(--green-l);font-weight:600">▲ ' + (s.playerIn  || '?') + '</div>' +
              '<div style="color:#f87171">▼ '                        + (s.playerOut || '?') + '</div>' +
              '<div style="font-size:0.68rem;color:var(--muted)">'   + s.team + '</div>' +
            '</div>' +
          '</div>';
        }).join('');

    el.innerHTML =
      '<div class="event-card"><div class="event-title">🟨 Cards</div>' + bHtml + '</div>' +
      '<div class="event-card"><div class="event-title">🔄 Substitutions</div>' + sHtml + '</div>';
  }

  function showToast(msg, type) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show ' + (type || 'info');
    setTimeout(function(){ t.classList.remove('show'); }, 3500);
  }
</script>
</body>
</html>
